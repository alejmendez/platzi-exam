name: Empaquetar extension

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Comprobar version y generar ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/package.ps1 -ExpectedTag $env:RELEASE_TAG
      - name: Guardar paquete descargable
        uses: actions/upload-artifact@v4
        with:
          name: platzi-exam-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: platzi-exam-${{ github.run_number }}
          path: dist
      - name: Crear etiqueta de la version si falta
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const { version } = require('./manifest.json');
            if (!/^\d+\.\d+\.\d+(\.\d+)?$/.test(version)) throw new Error('Version no valida');
            const tag = `v${version}`;
            const repo = context.repo;
            const fromTag = context.ref.startsWith('refs/tags/');
            if (fromTag && context.ref !== `refs/tags/${tag}`) throw new Error('Etiqueta y version no coinciden');
            let ref;
            try {
              ({ data: ref } = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!ref) {
              await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha: context.sha });
            } else if (!fromTag && ref.object.sha !== context.sha) {
              core.info(`${tag} ya existe en otro commit. Incrementa version para publicar otra version.`);
              return;
            }
            try {
              await github.rest.repos.getReleaseByTag({ ...repo, tag });
              core.info(`${tag} ya tiene una Release.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('tag', tag);
      - name: Publicar version con su ZIP
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --title "$RELEASE_TAG" --generate-notes
